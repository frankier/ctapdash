name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # Created up front so each matrix job can attach its own asset as soon as it
  # is built, instead of a single gather-everything job that loses all assets
  # if one platform fails.
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            gh release create "$tag" --generate-notes
          fi

  build:
    name: ${{ matrix.target }}
    needs: create-release
    # create-release is skipped on non-tag pushes; don't let that skip the build.
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            binary: dist/ctapdash/ctapdash
          - os: windows-latest
            target: windows-x86_64
            binary: dist/ctapdash/ctapdash.exe
          - os: macos-latest
            target: macos-arm64
            binary: dist/CTAP Dashboard.app/Contents/MacOS/ctapdash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group build

      - name: Build
        run: uv run pyinstaller ctapdash.spec --noconfirm --clean

      # A successful PyInstaller run proves very little: its failures are
      # runtime missing-import failures. The self-check starts the frozen
      # binary, serves, and forces the lazy MNE/matplotlib paths.
      - name: Smoke test
        shell: bash
        run: '"${{ matrix.binary }}" --smoke-test'

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts
          tar -czf "artifacts/ctapdash-${{ matrix.target }}.tar.gz" -C dist ctapdash

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path dist/ctapdash -DestinationPath "artifacts/ctapdash-${{ matrix.target }}.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          # ditto, not zip: zip mangles the symlinks inside .app bundles.
          ditto -c -k --keepParent "dist/CTAP Dashboard.app" "artifacts/ctapdash-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ctapdash-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          # These are ~200 MB each; do not keep every branch build forever.
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 7 }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF#refs/tags/}" artifacts/* --clobber
