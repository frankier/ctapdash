[project]
name = "ctapdash"
version = "0.2.0"
description = "A dashboard for viewing the outputs of CTAP pipelines"
readme = "README.md"
license = { file = "LICENCE" }
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.9",
    "mne[hdf5]>=1.12.1",
    "mplbed>=0.3.0",
    "natsort>=8.4.0",
    "pillow>=12.0",
    "platformdirs>=4.12.1",
    "scipy>=1.17.1",
    "starlette>=1.0.0",
    "starlette-htmx>=0.1.1",
    "workingtitle[desktop]",
    "xarray>=2026.2.0",
    "tbb4u>=2023.1.0",
    "bokeh==3.10",
    "tsdownsample>=0.1.5.1",
    "numba>=0.67.0",
    "pymatreader>=1.3.1",
]

[project.scripts]
ctapdash = "ctapdash.cli:main"
ctapdash-warm = "ctapdash.warm:main"

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-playwright>=0.7",
]

[build-system]
requires = ["uv_build >= 0.11.7, <0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["ctapdash", "venn_ts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
mne = { git = "https://github.com/mne-tools/mne-python.git" }
workingtitle = { git = "https://github.com/frankier/workingtitle.git" }
