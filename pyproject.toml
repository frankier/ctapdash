[project]
name = "ctapdash"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "marimo>=0.23.4",
    "matplotlib>=3.10.9",
    "mne>=1.12.1",
    "mplbed",
    "natsort>=8.4.0",
    "starlette>=1.0.0",
    "starlette-htmx>=0.1.1",
    "uvicorn>=0.46.0",
    "wand>=0.7.0",
]

[build-system]
requires = ["uv_build >= 0.11.7, <0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
mplbed = { git = "https://github.com/frankier/mplbed.git" }
