[project]
name = "ctapdash"
version = "0.1.1"
description = "A dashboard for viewing the outputs of CTAP pipelines"
readme = "README.md"
license = { file = "LICENCE" }
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.9",
    "mne[hdf5]>=1.12.1",
    "mplbed>=0.3.0",
    "natsort>=8.4.0",
    "pillow>=12.0",
    "scipy>=1.17.1",
    "starlette>=1.0.0",
    "starlette-htmx>=0.1.1",
    "uvicorn>=0.46.0",
    # mplbed serves every figure over a WebSocket; uvicorn does not pull in a
    # WebSocket implementation by itself.
    "websockets>=15",
    # No native window on Linux: pywebview needs PyGObject/WebKitGTK there,
    # which cannot be frozen reliably, so we open the system browser instead.
    "pywebview>=6.2.1; sys_platform != 'linux'",
    "xarray>=2026.2.0",
    "tbb4u>=2023.1.0",
    "bokeh==3.10",
    "tsdownsample>=0.1.5.1",
    "holoviews==1.23.2",
    "panel==1.10.0a4",
    "hvplot>=0.12.2",
    "numba>=0.67.0",
    "datashader>=0.19.1",
    "pymatreader>=1.3.1",
]

[project.scripts]
ctapdash = "ctapdash.cli:main"
ctapdash-warm = "ctapdash.warm:main"

[dependency-groups]
build = [
    "pyinstaller>=6.21.0",
    "pyinstaller-hooks-contrib",
]
test = [
    "pytest>=8",
    "pytest-playwright>=0.7",
]

[build-system]
requires = ["uv_build >= 0.11.7, <0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["ctapdash", "venn_ts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
mne = { git = "https://github.com/mne-tools/mne-python.git" }
