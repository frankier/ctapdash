{% extends "participant_base.html" %}

{% block participant_view_content %}
    <div class="p-2 bg-slate-100 flex flex-wrap w-full">
        <div class="text-nowrap mx-4">
            Log file:
            <form method="get" action="{{ url_for('participant_log') }}" class="inline-block">
                <input type="hidden" name="source" value="{{ source }}">
                <input type="hidden" name="participant" value="{{ participant }}">
                <select
                    name="log"
                    id="log-select"
                    onchange="this.form.requestSubmit()"
                    class="mx-4 my-2 inline-block rounded-md border border-black p-1 bg-white">
                    <option
                        value=""
                        {% if not current_log_file %}selected{% endif %}
                    >--- Please choose an option ---</option>
                    {% for log_file in logs %}
                        <option
                            {% if current_log_file == log_file %}selected{% endif %}
                            value="{{ log_file }}">
                            {{ log_file }}
                        </option>
                    {% endfor %}
                </select>
            </form>
        </div>
    </div>
    <div class="flex-1 p-4" id="log-content">
        <pre class="whitespace-pre-wrap">{{ content }}</pre>
    </div>
{% endblock %}
