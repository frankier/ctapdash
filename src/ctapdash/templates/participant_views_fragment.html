<div class="bg-slate-400 flex flex-wrap w-full">
    <div class="text-nowrap px-4 py-2
        {% if view == 'overview' %}bg-slate-300{% endif %}
    ">
        <a
            href="{{ url_for("participant_overview") }}{{ source_participant_qs }}"
            hx-get="{{ url_for("participant_overview") }}"
            hx-push-url="true"
            hx-include="#source-select, #participant-select"
            hx-target="#viewer"
            hx-swap="outerHTML">
            Overview
        </a>
    </div>
    <div class="text-nowrap px-4 py-2
        {% if view == 'steps' %}bg-slate-300{% endif %}
    ">
        <a
            href="{{ url_for("participant_steps") }}{{ source_participant_qs }}"
            hx-get="{{ url_for("participant_steps") }}"
            hx-push-url="true"
            hx-include="#source-select, #participant-select"
            hx-target="#viewer"
            hx-swap="outerHTML">
            Classic EEG viewer
        </a>
    </div>
    <div class="text-nowrap px-4 py-2
        {% if view == 'time_series' %}bg-slate-300{% endif %}
    ">
        <a
            href="{{ url_for("time_series") }}{{ source_participant_qs }}"
            hx-get="{{ url_for("time_series") }}"
            hx-push-url="true"
            hx-include="#source-select, #participant-select"
            hx-target="#viewer"
            hx-swap="outerHTML">
            Time series (HV)
        </a>
    </div>
    <div class="text-nowrap px-4 py-2
        {% if view == 'venn_time_series' %}bg-slate-300{% endif %}
    ">
        <a
            href="{{ url_for("venn_time_series") }}{{ source_participant_qs }}"
            hx-get="{{ url_for("venn_time_series") }}"
            hx-push-url="true"
            hx-include="#source-select, #participant-select"
            hx-target="#viewer"
            hx-swap="outerHTML">
            Compare steps
        </a>
    </div>
    <div class="text-nowrap px-4 py-2
        {% if view == 'hv_viewer' %}bg-slate-300{% endif %}
    ">
        <a
            href="{{ url_for("hv_viewer") }}{{ source_participant_qs }}"
            hx-get="{{ url_for("hv_viewer") }}"
            hx-push-url="true"
            hx-include="#source-select, #participant-select"
            hx-target="#viewer"
            hx-swap="outerHTML">
            Time series (hvPlot)
        </a>
    </div>
    <div class="
        text-nowrap px-4 py-2
        {% if view == 'peeks' %}bg-slate-300{% endif %}
    ">
        <a
            href="{{ url_for("participant_peeks") }}{{ source_participant_qs }}"
            hx-get="{{ url_for("participant_peeks") }}"
            hx-push-url="true"
            hx-include="#source-select, #participant-select"
            hx-target="#viewer"
            hx-swap="outerHTML">
            Quality control (peeks)
        </a>
    </div>
    <div
        class="
            text-nowrap px-4 py-2
            {% if view == 'logs' %}bg-slate-300{% endif %}
        ">
        <a
            href="{{ url_for("participant_log") }}{{ source_participant_qs }}"
            hx-get="{{ url_for("participant_log") }}"
            hx-push-url="true"
            hx-include="#source-select, #participant-select"
            hx-target="#viewer"
            hx-swap="outerHTML">
            Logs
        </a>
    </div>
</div>
