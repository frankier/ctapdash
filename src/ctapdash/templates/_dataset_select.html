<div class="p-2 bg-slate-100 flex flex-wrap w-full">
    <div class="text-nowrap mx-4">
        Dataset:
        <form method="get" action="{{ url_for('dataset_overview') }}" class="inline-block">
            <select
                name="source"
                id="source-select"
                onchange="this.form.requestSubmit()"
                class="mx-4 my-2 rounded-md border border-black p-1 bg-white">
                <option
                    value=""
                    disabled
                    {% if not source %}selected{% endif %}
                >--- Please choose an option ---</option>
                {% for some_source, directory in sources.items() %}
                    <option
                        value="{{ some_source }}"
                        {% if some_source == source %}selected{% endif %}
                    >{{ directory }}</option>
                {% endfor %}
            </select>
        </form>
        {% if managed_config %}
            <button type="button" id="source-settings-button" data-setup-url="{{ url_for('setup') }}?modal=1"
                    aria-label="Manage data sources" title="Manage data sources"
                    class="rounded-md border border-black bg-white px-2 py-1 hover:bg-sky-100">⚙</button>
            <dialog id="source-settings-dialog" aria-label="Manage data sources"
                    class="m-auto max-h-[90vh] w-full max-w-3xl overflow-y-auto whitespace-normal rounded-md border border-slate-400 bg-white p-0 shadow-xl">
                <div class="sticky top-0 z-10 flex justify-end border-b border-slate-300 bg-white p-2">
                    <button type="button" id="source-settings-close" class="rounded-md border border-black px-3 py-1">Done</button>
                </div>
                <div id="source-settings-content"></div>
            </dialog>
        {% endif %}
    </div>
</div>
