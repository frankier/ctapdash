<div class="p-2 bg-slate-100 flex flex-wrap w-full">
    <div class="text-nowrap mx-4">
        Dataset:
        <form method="get" action="{{ url_for('dataset_overview') }}" class="inline-block">
            <select
                name="source"
                id="source-select"
                onchange="this.form.requestSubmit()"
                class="mx-4 my-2 rounded-md border border-black p-1 bg-white">
                <option
                    value=""
                    {% if not source %}selected{% endif %}
                >--- Please choose an option ---</option>
                {% for some_source, directory in sources.items() %}
                    <option
                        value="{{ some_source }}"
                        {% if some_source == source %}selected{% endif %}
                    >{{ directory }}</option>
                {% endfor %}
            </select>
        </form>
    </div>
</div>
