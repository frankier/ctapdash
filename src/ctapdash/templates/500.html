<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link href="{{ url_for('static', path='generated/index.css') }}" rel="stylesheet">
        <title>Internal server error</title>
    </head>
    <body class="bg-slate-100 min-h-screen flex items-center justify-center">
        <div class="p-4 bg-white border border-black">
            <h1 class="text-3xl font-bold text-center py-2">Internal error</h1>

            <p class="text-gray-700 py-2">
                Internal error; There's been an error that indicates a bug in the code.
            </p>

            {% if stacktrace %}
                <p class="text-gray-700 py-2">
                    <a class="text-blue-600 visited:text-purple-600 hover:underline" target="_blank" href="{{ report_url }}">
                        <svg class="h-lh inline" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M280.5 426.5C214.5 418.5 168 371 168 309.5C168 284.5 177 257.5 192 239.5C185.5 223 186.5 188 194 173.5C214 171 241 181.5 257 196C276 190 296 187 320.5 187C345 187 365 190 383 195.5C398.5 181.5 426 171 446 173.5C453 187 454 222 447.5 239C463.5 258 472 283.5 472 309.5C472 371 425.5 417.5 358.5 426C375.5 437 387 461 387 488.5L387 540.5C387 555.5 399.5 564 414.5 558C505 523.5 576 433 576 321C576 179.5 461 64 319.5 64C178 64 64 179.5 64 321C64 432 134.5 524 229.5 558.5C243 563.5 256 554.5 256 541L256 501C249 504 240 506 232 506C199 506 179.5 488 165.5 454.5C160 441 154 433 142.5 431.5C136.5 431 134.5 428.5 134.5 425.5C134.5 419.5 144.5 415 154.5 415C169 415 181.5 424 194.5 442.5C204.5 457 215 463.5 227.5 463.5C240 463.5 248 459 259.5 447.5C268 439 274.5 431.5 280.5 426.5z"/></svg>
                        File an issue on GitHub
                    </a> please.
                </p>

                <p class="text-gray-700 py-2">
                    Please include this stacktrace:
                </p>

                <a class="text-blue-600 visited:text-purple-600 hover:underline py-2 block text-center" href="javascript:copyToClipboard(document.getElementById('stacktrace').innerText)">
                    <svg class="h-lh inline" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M448 96L439.4 96C428.4 76.9 407.7 64 384 64L256 64C232.3 64 211.6 76.9 200.6 96L192 96C156.7 96 128 124.7 128 160L128 512C128 547.3 156.7 576 192 576L448 576C483.3 576 512 547.3 512 512L512 160C512 124.7 483.3 96 448 96zM264 176C250.7 176 240 165.3 240 152C240 138.7 250.7 128 264 128L376 128C389.3 128 400 138.7 400 152C400 165.3 389.3 176 376 176L264 176z"/></svg>
                    Copy to clipboard
                </a>

                <pre id="stacktrace" class="mx-auto my=2 max-w-lg max-h-[30vh] overflow-scroll">{{ stacktrace }}</pre>
            {% endif %}

            {% include "_escape_hatch.html" %}
        </div>
    </body>
</html>
