<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    {{ head_webagg|safe }}
    <link href="https://unpkg.com/tabulator-tables/dist/css/tabulator.min.css" rel="stylesheet">
    <script type="text/javascript" src="//unpkg.com/tabulator-tables/dist/js/tabulator.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.7/dist/htmx.js" integrity="sha384-yWakaGAFicqusuwOYEmoRjLNOC+6OFsdmwC2lbGQaRELtuVEqNzt11c2J711DeCZ" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx-ext-sse@2.2.2" integrity="sha384-BkCCd4DbvhfvRLfThp+5RN2KiB1FBROoAtwZFfceJishUnpFW1eF/aqG14M5TwA2" crossorigin="anonymous"></script>
    <script src="//unpkg.com/alpinejs" defer></script>
    <title>{% block title %}{% endblock %}</title>
    <style>
    @layer utilities {
        .small-caps {
            font-variant: all-small-caps;
        }
    }
    </style>
    <script>
    // https://github.com/bigskysoftware/htmx/issues/2156#issuecomment-1968042842
    htmx.defineExtension('push-url-w-params', {
        onEvent : function(name, e) {
            if (name === "htmx:configRequest") {
                const path = e.target.getAttribute('data-push-url')
                const params = new URLSearchParams(e.detail.parameters).toString()
                let url;
                if (path.indexOf("://") == -1) {
                    url = `${window.location.origin}${path}?${params}`
                } else {
                    url = `${path}?${params}`
                }
                window.history.pushState({}, '', url);
            }
        }
    });
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen relative" {% block body_attrs %}{% endblock %}>
    <div class="bg-black text-white top-0 left-0 w-full text-center z-10 small-caps tracking-wider flex">
        <div class="p-2 ph-4 hover:bg-sky-800">
            Single dataset
        </div>
        <div class="p-2 ph-4 hover:bg-sky-800">
            Dataset comparison
        </div>
    </div>
    <div id="content">
        {% block content %}{% endblock %}
    </div>
    <div id="spinner" class="htmx-indicator fixed inset-0 place-self-center p-20 bg-white z-50 drop-shadow-xl">
        <img
            src="/static/img/flask.gif"
            alt="Loading...">
    </div>
</body>
</html>
